plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        // Автотест: сам создаёт мир, открывает экраны, снимает скриншоты и выходит.
        autotest {
            client()
            gameDirectory = project.file('run')
            systemProperty 'rysindex.autotest', project.findProperty('autotest') ?: 'default'
            programArguments.addAll '--width', '1280', '--height', '720'
            if (project.findProperty('plan') != null) systemProperty 'rysindex.autotest.plan', project.findProperty('plan')
            if (project.findProperty('compare') != null) systemProperty 'rysindex.autotest.compare', project.findProperty('compare')
            if (project.findProperty('cats') != null) systemProperty 'rysindex.autotest.cats', project.findProperty('cats')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Общий код подключается исходниками: один jar, один набор классов.
sourceSets.main {
    java.srcDir project(':common').file('src/main/java')
    resources.srcDir project(':common').file('src/main/resources')
}

dependencies {
    implementation "works.repka.ryscore:ryscore-neoforge:${ryscore_version}"
    // Кор вкладывается в наш jar: игрок ставит один мод, при нескольких модах семьи загрузчик берёт самую новую версию.
    jarJar("works.repka.ryscore:ryscore-neoforge:[${ryscore_version},2.0.0)") {
        version {
            prefer ryscore_version
        }
        transitive = false
    }
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (project.findProperty('noJei') == null) {
        // -PjeiRun=<версия>: проверить dev-клиент с другой версией JEI (например, с минимальной)
        runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${project.findProperty('jeiRun') ?: jei_run_version}"
    }
    // JEI в jar не вкладывается (с 0.3.9): это обычная обязательная зависимость, игрок ставит его отдельно.
    compileOnly 'org.jetbrains:annotations:26.0.1'
    // AE2 только для компиляции миксинов замещения в шаблонах обработки: в jar не попадает, в игре стоит отдельным модом
    compileOnly "org.appliedenergistics:appliedenergistics2:19.2.17"

    // -PextraMods=<папка>: подключить к dev-клиенту моды из папки (например, из тестового инстанса)
    if (project.findProperty('extraMods') != null) {
        runtimeOnly fileTree(dir: project.findProperty('extraMods'), include: '*.jar',
            excludes: ['jei-*.jar', 'mezz_config*.jar', 'rysindex-*.jar', 'ryscope-*.jar'])
    }
}

processResources {
    def props = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_authors: mod_authors, mod_license: mod_license,
        minecraft_version: minecraft_version, neoforge_version: neoforge_version,
        jei_version: jei_version, ryscore_version: ryscore_version
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

// Код автотеста (AutoTest*, стенд CoreKitBench) в боевой jar не идёт (с 0.3.10): с ним CurseForge не пропускал файл
// через автоматическую проверку. Полный jar с автотестом собирается рядом с классификатором autotest, его берёт prodtest.
def autotestClasses = ['works/repka/rysindex/neoforge/AutoTest*', 'works/repka/rysindex/neoforge/CoreKitBench*']
tasks.named('jar', Jar) {
    exclude autotestClasses
}
def autotestJar = tasks.register('autotestJar', Jar) {
    archiveClassifier = 'autotest'
    // LICENSE и NOTICE.md уже лежат в боевом jar, общий блок ниже добавляет их ещё раз
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(zipTree(tasks.named('jar', Jar).flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(sourceSets.main.output) {
        include autotestClasses
    }
}
tasks.named('assemble') {
    dependsOn autotestJar
}

// LICENSE and NOTICE.md go into every jar of the mod (MPL-2.0 for code, notice about graphics and third-party parts).
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE'))
    from(rootProject.file('NOTICE.md'))
}
